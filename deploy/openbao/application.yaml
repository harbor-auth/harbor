# Dedicated in-cluster Transit KMS for Harbor. This Application belongs only
# to the Harbor ArgoCD instance; Harbor Cloud has a separate cluster and ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://openbao.github.io/openbao-helm
      chart: openbao
      targetRevision: 0.28.6
      helm:
        releaseName: openbao
        valueFiles:
          - $values/deploy/openbao/values.yaml
    - repoURL: git@github.com:harbor-auth/harbor.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:harbor-auth/harbor.git
      targetRevision: main
      path: deploy/openbao/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
