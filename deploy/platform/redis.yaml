apiVersion: v1
kind: Service
metadata:
  name: harbor-redis-master
  namespace: harbor
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: harbor
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: harbor
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: harbor-redis
  namespace: harbor
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: harbor
spec:
  serviceName: harbor-redis-master
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: harbor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: harbor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
          imagePullPolicy: IfNotPresent
          command: [redis-server]
          args: [/etc/redis-auth/redis.conf]
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: harbor-redis-auth
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: auth
              mountPath: /etc/redis-auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: auth
          secret:
            secretName: harbor-redis-auth
            defaultMode: 0440
            items:
              - key: redis.conf
                path: redis.conf
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: harbor-redis
  namespace: harbor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: harbor
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: harbor-hot
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: harbor-mgmt
      ports:
        - port: 6379
          protocol: TCP
  egress: []
