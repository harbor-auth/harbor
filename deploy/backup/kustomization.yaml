# Kustomization for deploy/backup/
#
# Applied by the `harbor-backup` ArgoCD Application (deploy/argocd/
# backup-application.yaml). It can also be applied by hand:
#   kubectl apply -k deploy/backup/
#
# Resources applied:
#   - cronjob-etcd.yaml        — harbor-etcd-sync CronJob (etcd snapshots → R2, every 6h)
#   - cronjob-pgdump.yaml      — harbor-pgdump CronJob (pg_dump → R2, daily 03:00 UTC)
#   - cronjob-pgdump-local.yaml — harbor-pgdump-local CronJob + PVC (pg_dump to
#     an on-cluster volume, daily 02:00 UTC). Needs no credentials, so it gives
#     the cluster a recovery point while the offsite path waits on R2 keys. It
#     is a complement to offsite backup, not a substitute — see its header.
#
# NOT applied from here:
#
#   - secret-backup.yaml is a TEMPLATE carrying CHANGEME placeholders. It is
#     deliberately excluded: this kustomization is reconciled continuously by
#     ArgoCD, and including a placeholder Secret would let a sync overwrite the
#     real credentials with CHANGEME and silently break every backup. The
#     Secret is created out of band, the same way harbor-hot-secrets and
#     harbor-mgmt-secrets are (see README.md "Credential Setup").
#
#   - rke2-etcd-s3-snippet.yaml is an informational config reference, not a
#     Kubernetes resource.
#
# Prerequisites (create once, not managed here — see README.md):
#   kubectl create namespace harbor-backup
#   kubectl label namespace harbor-backup \
#     pod-security.kubernetes.io/enforce=privileged \
#     pod-security.kubernetes.io/warn=privileged
#   kubectl create serviceaccount harbor-backup -n harbor-backup
#   kubectl create secret generic backup-credentials -n harbor-backup ...
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cronjob-etcd.yaml
  - cronjob-pgdump.yaml
  - cronjob-pgdump-local.yaml
