# backup-credentials — rclone S3/R2 credentials for harbor-backup CronJobs.
#
# ⚠️  DO NOT COMMIT REAL VALUES. This file is a placeholder template.
#     Populate values from ~/.harbor.env before applying:
#
#     kubectl create secret generic backup-credentials \
#       --namespace=harbor-backup \
#       --from-literal=RCLONE_CONFIG_R2_TYPE=s3 \
#       --from-literal=RCLONE_CONFIG_R2_PROVIDER=Cloudflare \
#       --from-literal=RCLONE_CONFIG_R2_ACCESS_KEY_ID=<from ~/.harbor.env> \
#       --from-literal=RCLONE_CONFIG_R2_SECRET_ACCESS_KEY=<from ~/.harbor.env> \
#       --from-literal=RCLONE_CONFIG_R2_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com \
#       --from-literal=RCLONE_CONFIG_R2_REGION=auto \
#       --dry-run=client -o yaml | kubectl apply -f -
#
#     For AWS S3, replace PROVIDER=Cloudflare with PROVIDER=AWS and set
#     ENDPOINT to the regional S3 endpoint (or omit for us-east-1 default).
#
# Long-term: replace with External Secrets Operator pulling from Vault/AWS SSM
# (tracked in kms-credentials-rotation plan).
apiVersion: v1
kind: Secret
metadata:
  name: backup-credentials
  namespace: harbor-backup
  labels:
    app.kubernetes.io/name: harbor-backup
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: harbor
type: Opaque
stringData:
  # rclone remote "r2" — Cloudflare R2 (S3-compatible, zero egress fees).
  # Switch PROVIDER to AWS and set ENDPOINT to us-east-1 for AWS S3.
  RCLONE_CONFIG_R2_TYPE: "s3"
  RCLONE_CONFIG_R2_PROVIDER: "Cloudflare"
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: "CHANGEME"
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: "CHANGEME"
  RCLONE_CONFIG_R2_ENDPOINT: "https://CHANGEME.r2.cloudflarestorage.com"
  RCLONE_CONFIG_R2_REGION: "auto"
  # Bucket name — must match etcd-s3-bucket in rke2-etcd-s3-config-snippet.yaml.
  BACKUP_BUCKET: "harbor-backups"
