# SealedSecret template — Dex GitHub OAuth client secret
#
# ⚠️  THIS FILE CONTAINS PLACEHOLDER VALUES ONLY.
#     The encryptedData values below are NOT real ciphertext.
#     An operator MUST run the kubeseal command documented below to generate
#     real sealed values before this manifest is applied to the cluster.
#
# =============================================================================
# WHY A SEALEDSECRET?
# =============================================================================
# ArgoCD's Dex needs the GitHub OAuth client secret at key
# "dex.github.clientSecret" inside the "argocd-secret" Secret.
# We use Bitnami Sealed Secrets so the ciphertext is safe to commit to git —
# only the in-cluster SealedSecrets controller (which holds the private key)
# can decrypt it.
#
# =============================================================================
# OPERATOR STEPS — run once per environment before applying the overlay
# =============================================================================
#
# 1. Ensure the Sealed Secrets controller is installed in the cluster:
#      kubectl get deployment -n kube-system sealed-secrets-controller
#    If not installed:
#      helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
#      helm install sealed-secrets sealed-secrets/sealed-secrets \
#        -n kube-system --set fullnameOverride=sealed-secrets-controller
#
# 2. Fetch the controller's public key (safe to share):
#      kubeseal --fetch-cert \
#        --controller-namespace kube-system \
#        --controller-name sealed-secrets-controller \
#        > pub-sealed-secrets.pem
#
# 3. Seal the GitHub OAuth client secret.
#    Replace <CLIENT_SECRET> with the actual value from the GitHub OAuth App.
#    The --scope strict flag binds the sealed value to the exact name+namespace
#    of this Secret (argocd-secret / argocd namespace) and this cluster's key
#    (not portable to another cluster with a different controller key):
#
#      echo -n '<CLIENT_SECRET>' | kubeseal \
#        --raw \
#        --from-file=/dev/stdin \
#        --namespace argocd \
#        --name argocd-secret \
#        --scope strict \
#        --cert pub-sealed-secrets.pem
#
#    Copy the output (a base64-encoded ciphertext) into the
#    encryptedData.dex.github.clientSecret field below, replacing the
#    PLACEHOLDER_REPLACE_ME value.
#
# 4. Apply the overlay (which references this file via kustomization.yaml):
#      kubectl apply --dry-run=client -k deploy/argocd/   # validate first
#      kubectl apply -k deploy/argocd/
#
# 5. Verify the Secret was created/updated:
#      kubectl get secret argocd-secret -n argocd -o jsonpath='{.data}' | \
#        python3 -c "import sys,json,base64; d=json.load(sys.stdin); \
#          print('dex.github.clientSecret present:', \
#          'dex.github.clientSecret' in d)"
#
# =============================================================================
# ALTERNATIVE: patch the Secret imperatively (no Sealed Secrets controller)
# =============================================================================
# If Sealed Secrets is not available, inject the secret out-of-band instead:
#
#   kubectl -n argocd patch secret argocd-secret \
#     --type='json' \
#     -p='[{"op":"add","path":"/data/dex.github.clientSecret",
#           "value":"'"$(echo -n '<CLIENT_SECRET>' | base64 -w0)"'"}]'
#
# The imperative patch is NOT committed to git.  Document the key name in this
# file so the structure is clear without leaking the value.
#
# =============================================================================
# LONG-TERM: migrate to External Secrets Operator (ESO)
# =============================================================================
# Once ESO is deployed (see kms-credentials-rotation plan), replace this
# SealedSecret with an ExternalSecret that pulls from AWS SSM / Vault:
#
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata:
#     name: argocd-dex-secret
#     namespace: argocd
#   spec:
#     refreshInterval: 1h
#     secretStoreRef:
#       name: cluster-secret-store
#       kind: ClusterSecretStore
#     target:
#       name: argocd-secret
#       creationPolicy: Merge       # merge into existing argocd-secret
#     data:
#     - secretKey: dex.github.clientSecret
#       remoteRef:
#         key: /harbor/argocd/dex-github-client-secret
#
# =============================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-secret
  namespace: argocd
  annotations:
    # sealedsecrets.bitnami.com/managed: "true" tells the controller to merge
    # this into the existing argocd-secret rather than replacing it wholesale,
    # preserving other keys (admin.password, server.secretkey, etc.).
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # REPLACE THIS VALUE with the output of the kubeseal --raw command above.
    # The placeholder below is intentionally invalid and will be rejected by
    # the controller — this forces the operator to run the sealing step.
    dex.github.clientSecret: PLACEHOLDER_REPLACE_ME_run_kubeseal_command_above
  template:
    metadata:
      name: argocd-secret
      namespace: argocd
    type: Opaque
