# Production Helm value overrides for the isolated Harbor K3s cluster
# (harbor-core VM / auth.harborauth.com), consumed by the ArgoCD Application
# in this directory.
#
# Per-component image digests are proposed by .github/workflows/publish.yml
# in checked pull requests. Review signatures and source provenance before merge.
# The all-zero bootstrap digests deliberately resolve to no image; production
# remains fail-closed until the first successful signed publish replaces them.

global:
  # Pull credential for the private GHCR packages. Created out of band on the
  # cluster (kubernetes.io/dockerconfigjson), like every other credential here.
  #
  # SHORTCUT — NOT PRODUCTION READY: the token currently in this Secret is a
  # personal OAuth token that also carries admin:enterprise, repo and workflow.
  # It works, but it is far broader than a pull credential needs to be. Replace
  # it with a classic PAT limited to read:packages, or make the packages
  # public. See SHORTCUTS in docs/.
  imagePullSecrets:
    - ghcr-pull
  # The isolated core cluster is intentionally a single K3s node.
  topologyKey: kubernetes.io/hostname
  image:
    registry: ghcr.io/harbor-auth/harbor
    pullPolicy: IfNotPresent
  postgresTLS:
    enabled: true
    secretName: harbor-postgresql-tls
    mountPath: /var/run/secrets/postgresql
# Single-region dev/prod: binds the issuer / RP-origin hosts to a region so the
# fail-closed region middleware resolves them instead of 400-rejecting.
region: EU
hot:
  image:
    digest: sha256:c2e4c7af511b000e3fd75f12adc8bef2ada5001745a65ada547f7b264bfb81a6
  # Single node — one replica. HPA/PDB are meaningless here and are disabled.
  replicaCount: 1
  issuer: https://auth.harborauth.com
  # Where /authorize sends an unauthenticated user. This is a BROWSER
  # destination, so it must be the server-rendered page (GET /signin,
  # signinHandler.ServeSignin) and not GET /login — that route is
  # loginHandler.BeginLogin, the WebAuthn ceremony API, and navigating to it
  # renders a raw JSON challenge instead of a sign-in form.
  #
  # The chart default is the scaffold https://auth.example.com/login, which is
  # wrong twice over: the host does not exist, and /login is the API.
  loginURL: https://auth.harborauth.com/signin
  hpa:
    enabled: false
  pdb:
    enabled: false
  networkPolicy:
    ingressControllerNamespace: ingress-nginx
  # Reference the Secret provisioned out-of-band in the harbor namespace
  # (DATABASE_URL / REDIS_URL / HARBOR_KMS_SECRET / ADMIN_API_TOKEN) rather
  # than committing credentials.
  secrets:
    existingSecret: harbor-hot-secrets-v2
  kms:
    provider: openbao
    openbao:
      address: https://openbao.openbao.svc:8200
      kubernetesRole: harbor-hot
      transitMount: transit
      caConfigMap: openbao-ca
      tokenAudience: openbao
      tokenExpirationSeconds: 600
mgmt:
  # Both default to the scaffold auth.example.com in the chart. Unset, the
  # post-authentication hand-back and the RFC 7591 registration responses point
  # at a domain nobody owns.
  authorizeCompleteURL: https://auth.harborauth.com/authorize/complete
  registrationBaseURL: https://auth.harborauth.com
  image:
    digest: sha256:2593418bd8f9e3473fd157a4e011a6fd3bf042f5da93d3605abebaf715d7c14f
  replicaCount: 1
  webauthn:
    rpId: auth.harborauth.com
    rpName: Harbor
    rpOrigin: https://auth.harborauth.com
  pdb:
    enabled: false
  secrets:
    existingSecret: harbor-mgmt-secrets-v2
  cloudIntegration:
    enabled: true
    nodePort: 30081
    # Harbor Cloud's WireGuard tunnel address; the two clusters share no pod or
    # service network and Harbor Cloud receives no Harbor kubeconfig.
    allowedCIDR: 10.88.0.2/32
ingress:
  enabled: true
  className: nginx
  host: auth.harborauth.com
  # Provisioned by cert-manager (Let's Encrypt) into the harbor namespace.
  tlsSecretName: harbor-tls
  annotations:
    # Drop the chart-default cluster-issuer annotation. The explicit Certificate
    # `harbor-public` (deploy/platform/pki.yaml, delivered by the harbor-platform
    # Application) is the single owner of the `harbor-tls` Secret. Leaving the
    # annotation in place makes cert-manager's ingress-shim create a SECOND
    # Certificate named after the Secret, and the two race for it — the loser
    # sits permanently NotReady with reason IncorrectCertificate and renewal
    # ownership is nondeterministic.
    #
    # `null` (not `{}`) is required: values files deep-merge into the chart
    # defaults, so an explicit null is what removes a single inherited key while
    # keeping the sibling ssl-redirect/proxy-timeout annotations.
    cert-manager.io/cluster-issuer: null
# OpenBao Transit key name. This is an identifier, not key material.
kmsKeyMap: EU=harbor-eu
# migrate Job uses harbor-hot's Secret by default (shares the same DATABASE_URL).
# The DB user must have DDL privileges (CREATE/ALTER TABLE). Set
# migrate.enabled=false to manage schema migrations out-of-band.
#
# BOOTSTRAP SEED: NO LONGER REQUIRED — DO NOT RUN.
# This block previously instructed operators to create schema_migrations and
# seed it with version 16. That is now both unnecessary and actively harmful:
# the production database already has a schema_migrations table reporting
# version 18, dirty=false (verified 2026-08-05). Re-seeding 16 would make
# golang-migrate replay 0017 and 0018 over an already-migrated schema and leave
# the DB dirty. The migrate Job picks up from 18 and applies 0019 forward on its
# own. Verify current state with:
#   kubectl exec -n harbor harbor-postgresql-0 -- \
#     psql -U harbor -d harbor -h 127.0.0.1 -tAc "SELECT version, dirty FROM schema_migrations;"
migrate:
  # Runtime connections use a non-owner role; only migrations receive DDL credentials.
  secrets:
    existingSecret: harbor-migrate-secrets
  image:
    digest: sha256:8b8b28800d702f491394c4c38a11e0331bed79920215f0e9ca2ac8b5f492ffa3
# The harbor namespace already exists (created by the initial install); ArgoCD
# manages resources inside it but must not try to re-create it.
namespace:
  create: false

# User-data wrapping roots remain in OpenBao Transit after the staged migration.
userDEK:
  provider: openbao
  keyMap: EU=harbor-users-eu
  legacyReadEnabled: false
  writeExternalEnabled: true
  mgmtRole: harbor-mgmt
