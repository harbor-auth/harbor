apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/harbor-auth/harbor.git
    targetRevision: main
    path: deploy/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  # The API server defaults several fields inside StatefulSet
  # volumeClaimTemplates that git cannot express: apiVersion/kind on each
  # template, spec.volumeMode (Filesystem), and a status block. ArgoCD does not
  # normalise these, so harbor-postgresql and harbor-redis would report
  # OutOfSync forever and selfHeal would re-sync them on every reconcile.
  #
  # volumeClaimTemplates are immutable after creation — a StatefulSet update
  # cannot resize or otherwise alter them — so ignoring the field drops no
  # drift signal we could act on. Changing storage requires recreating the
  # StatefulSet deliberately, which this rule does not hide.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
