# Ingress: the shared public origin routes the BFF login paths and the
# public signup/sign-in surface (/signup*, /signin, /enroll, /webauthn/*,
# /recovery/*, /dashboard*) to harbor-mgmt; every other path goes to
# harbor-hot. Other management APIs stay unreachable because no public path
# selects them.
#
# The host here MUST match ISSUER in configmap-hot.yaml, or the OIDC discovery
# document will advertise endpoints under a different origin than clients reach.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor-hot
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor-hot
    app.kubernetes.io/part-of: harbor
  annotations:
    # Force TLS: an OIDC issuer over plaintext leaks codes/tokens.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Keep proxy timeouts tight — hot-path requests are fast; a hung upstream
    # should fail quickly rather than pin a connection.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    # Block privileged admin endpoints at the ingress layer — defence-in-depth
    # on top of application-level auth. The /admin/* paths must never be
    # reachable from the internet regardless of auth state.
    nginx.ingress.kubernetes.io/server-snippet: |
      location ~* ^/admin {
        deny all;
        return 403;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.example.com
      # SCAFFOLD: provision this cert (e.g. via cert-manager) — the Secret must
      # exist before the Ingress can terminate TLS.
      secretName: harbor-tls
  rules:
    - host: auth.example.com
      http:
        paths:
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: harbor-mgmt
                port:
                  number: 80
          - path: /signup
            pathType: Prefix
            backend:
              service:
                name: harbor-mgmt
                port:
                  number: 80
          - path: /signin
            pathType: Prefix
            backend:
              service:
                name: harbor-mgmt
                port:
                  number: 80
          - path: /enroll
            pathType: Prefix
            backend:
              service:
                name: harbor-mgmt
                port:
                  number: 80
          - path: /webauthn
            pathType: Prefix
            backend:
              service:
                name: harbor-mgmt
                port:
                  number: 80
          - path: /recovery
            pathType: Prefix
            backend:
              service:
                name: harbor-mgmt
                port:
                  number: 80
          # /dashboard: the BFF dashboard (internal/bff/dashboard.go) — where
          # BOTH the post-registration handoff and GET /login/sso's 303 land
          # (SSO_DASHBOARD_PATH defaults to "/dashboard"; M2). Without this
          # entry the request falls through to the "/" catch-all below and
          # harbor-hot 404s it.
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: harbor-mgmt
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harbor-hot
                port:
                  number: 80
