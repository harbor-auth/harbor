# Non-sensitive config for harbor-mgmt.
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-mgmt-config
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor-mgmt
    app.kubernetes.io/part-of: harbor
data:
  PORT: "8081"
  REGION: "EU"
  HARBOR_DEV_MODE: "false"
  KMS_KEY_MAP: "EU=REPLACE_WITH_REGIONAL_KMS_KEY_ID"
  # WebAuthn Relying Party config (docs/DESIGN.md §3.1).
  #   RP_ID    — effective domain (no scheme/port). Passkeys are scoped to
  #              this; it MUST be a registrable suffix of the origin below.
  #   ORIGIN   — the fully-qualified site permitted to run ceremonies. This is
  #              the dashboard/BFF origin, NOT the issuer. REPLACE example.com
  #              with your real domain.
  #   RP_NAME  — human-facing Relying Party name shown in browser passkey prompts.
  WEBAUTHN_RP_ID: "example.com"
  WEBAUTHN_RP_DISPLAY_NAME: "Harbor"
  WEBAUTHN_RP_ORIGINS: "https://dashboard.example.com"
  # Absolute URL of harbor-hot's /authorize/complete endpoint. After a
  # successful passkey assertion harbor-mgmt redirects the browser here to
  # resume the OIDC flow. It MUST be absolute (a relative path resolves against
  # the harbor-mgmt origin and 404s — audit finding M2) and, because the BFF
  # cookie uses the __Host- prefix, MUST share the public origin with harbor-hot
  # (single-host, path-routed ingress — see deploy/README.md). harbor-mgmt
  # refuses to start if DATABASE_URL is set but this is empty.
  # SCAFFOLD: replace example.com with your real domain (matches ISSUER host).
  AUTHORIZE_COMPLETE_URL: "https://auth.example.com/authorize/complete"
  MTA_DOMAIN: "mta-eu.harbor.id"
  RELAY_DOMAIN: "relay.eu.harbor.id"
