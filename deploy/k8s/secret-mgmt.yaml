# Secret for harbor-mgmt (the cold-path enrollment / passkey / dashboard BFF).
#
# SCAFFOLD: base64/string PLACEHOLDERS — REPLACE before deployment and inject
# via a secrets manager in production (do not commit real values).
#
# Separate from harbor-hot-secrets so the service accounts receive only their
# own database and application credentials. HARBOR_KMS_SECRET is deliberately
# shared: both binaries must wrap and unwrap the same user DEKs.
#
#   DATABASE_URL      — regional Postgres DSN. Enrollment writes user DEKs here.
#   REDIS_URL         — distributed BFF/WebAuthn/enrollment/abuse state.
#   HARBOR_KMS_SECRET — shared user-DEK KEK; MUST equal harbor-hot's value.
#   INITIAL_ACCESS_TOKEN — authorization for dynamic client registration.
#   CLOUD_SERVICE_AUTH_PUBLIC_KEY / MGMT_HOT_PROXY_TOKEN — only read when
#   configmap-mgmt.yaml's CLOUD_INTEGRATION_ENABLED is "true"; see
#   internal/cloudapi and deploy/README.md's "Harbor Cloud management API"
#   section. Placeholders below are inert while integration stays disabled.
apiVersion: v1
kind: Secret
metadata:
  name: harbor-mgmt-secrets
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor-mgmt
    app.kubernetes.io/part-of: harbor
type: Opaque
stringData:
  # REPLACE all values below with real values from your secrets manager.
  DATABASE_URL: "postgres://harbor_mgmt:REPLACE_ME@postgres.harbor.svc:5432/harbor?sslmode=require"
  REDIS_URL: "redis://:REPLACE_ME@redis.harbor.svc:6379/0"
  HARBOR_KMS_SECRET: "REPLACE_ME_WITH_SHARED_32_BYTE_USER_DEK_KEK"
  INITIAL_ACCESS_TOKEN: "REPLACE_ME_WITH_A_256_BIT_REGISTRATION_TOKEN"
  # Unused while CLOUD_INTEGRATION_ENABLED is "false" (configmap-mgmt.yaml).
  CLOUD_SERVICE_AUTH_PUBLIC_KEY: "REPLACE_ME_WITH_HARBOR_CLOUDS_PEM_ENCODED_TRUST_ANCHOR_PUBLIC_KEY"
  # Additional trust anchors, each optionally scope- and namespace-bound. Empty
  # is valid: one anchor above is enough. Two anchors let a key be rotated as a
  # rolling change — publish the new one here, swap the signer, then retire the
  # old — instead of a coordinated cutover across both clusters.
  CLOUD_SERVICE_AUTH_PUBLIC_KEYS: ""
  MGMT_HOT_PROXY_TOKEN: "REPLACE_ME_WITH_A_256_BIT_CLOUD_PROXY_TOKEN"
  # Keys the federated-subject HMAC. Corporate SSO subjects (NameIDs) are
  # stored only as HMACs under this key, never in the clear, so rotating it
  # orphans every existing federated identity and re-JITs those users.
  # Hex or base64url, 32 bytes.
  SSO_SUBJECT_HMAC_KEY: "REPLACE_ME_WITH_A_256_BIT_SSO_SUBJECT_HMAC_KEY"
