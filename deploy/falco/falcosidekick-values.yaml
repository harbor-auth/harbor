# Falcosidekick Helm values — phase 2 alert routing stub.
#
# STATUS: Phase 1 (stdout-only shadow mode) is active.
#         This file is a stub for phase 2. Wire after triage is complete.
#
# Rollout procedure:
#   Phase 1 (week 1+): Falco writes JSON events to stdout only.
#     - Collect events: kubectl logs -n falco -l app.kubernetes.io/name=falco -f
#     - Triage false positives and add scoped rule exceptions to
#       deploy/falco/rules/harbor_rules.yaml (commit + review each exception).
#     - When false-positive rate is acceptable, proceed to phase 2.
#
#   Phase 2: Enable Falcosidekick for structured alert routing.
#     1. Fill in the outputs below (Slack webhook, Alertmanager host, etc.).
#     2. Set falcosidekick.enabled: true in deploy/falco/values-falco.yaml.
#     3. Uncomment and configure the sections below.
#     4. helm upgrade falco falcosecurity/falco -n falco \
#          -f deploy/falco/values-falco.yaml \
#          -f deploy/falco/falcosidekick-values.yaml
#
# Install command (phase 2):
#   helm upgrade falco falcosecurity/falco \
#     -n falco \
#     -f deploy/falco/values-falco.yaml \
#     -f deploy/falco/falcosidekick-values.yaml
#
# Reference: docs/plans/falco-runtime-detection.md §2.4

