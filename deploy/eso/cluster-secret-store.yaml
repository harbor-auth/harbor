# ClusterSecretStore — AWS SSM Parameter Store backend for the External Secrets Operator.
#
# This store is cluster-scoped: it is referenced by ExternalSecrets in the
# harbor namespace (and potentially other namespaces in future). The bootstrap
# credential (eso-ssm-credentials) is the ONLY hand-provisioned Secret left in
# the cluster; it is provisioned once out-of-band from a Sealed Secret and
# NEVER committed in plaintext. See README.md for the provisioning procedure.
#
# IAM trust model (two-tier, least-privilege):
#   Bootstrap IAM user (this store):
#     Permission: ssm:GetParameter on arn:aws:ssm:*:*:parameter/harbor/*
#     Cannot touch KMS — reads SSM only.
#   Workload IAM user (stored IN SSM at /harbor/kms/*):
#     Permission: kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey
#     on the Harbor KEK ARN only. Cannot read SSM.
#
# Apply order: ESO CRDs must exist first (installed by Helm with installCRDs: true),
# then this ClusterSecretStore, then the ExternalSecret in external-secret-kms.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: harbor-ssm
  labels:
    app.kubernetes.io/name: harbor-ssm
    app.kubernetes.io/component: secret-store
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # Human-readable description for audit/ops visibility.
    external-secrets.io/description: >-
      AWS SSM Parameter Store backend for Harbor KMS credentials.
      Bootstrap credential: eso-ssm-credentials in external-secrets namespace.
      IAM user: ssm:GetParameter on /harbor/* only (no KMS rights).
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      auth:
        secretRef:
          # The bootstrap IAM user access key. Provisioned once from a Sealed
          # Secret (see README.md). NEVER commit real values here.
          # Secret must live in the same namespace as the ESO controller.
          accessKeyIDSecretRef:
            name: eso-ssm-credentials
            key: access-key-id
            namespace: external-secrets
          secretAccessKeySecretRef:
            name: eso-ssm-credentials
            key: secret-access-key
            namespace: external-secrets
