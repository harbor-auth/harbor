# ExternalSecret — maps AWS SSM Parameter Store paths to the harbor-kms-credentials
# Secret consumed by harbor-hot as env vars (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY).
#
# Refresh model:
#   ESO re-fetches /harbor/kms/* from SSM every hour (refreshInterval: 1h).
#   When ops rotate the KMS IAM user key (IAM → update SSM → wait ≤ 1h) ESO
#   overwrites harbor-kms-credentials automatically. The Deployment does NOT
#   auto-restart on Secret change — a rollout restart is required (see README.md
#   rotation runbook), or deploy Stakater Reloader for automatic restarts.
#
# Safety invariants:
#   creationPolicy: Owner — ESO is the sole owner of this Secret; prevents
#     conflicts with any previously hand-provisioned version.
#   deletionPolicy: Retain — if ESO is removed/broken, the last-synced Secret
#     stays in place and harbor-hot keeps running. Availability > cleanup.
#
# Namespace: harbor — namespaced alongside the harbor-hot Deployment.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-kms-credentials
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor-kms-credentials
    app.kubernetes.io/component: external-secret
    app.kubernetes.io/managed-by: kustomize
  annotations:
    external-secrets.io/description: >-
      Pulls KMS workload IAM credentials from AWS SSM Parameter Store and
      writes them into the harbor-kms-credentials Secret. Rotated at most
      hourly; ops rotate the key in IAM, update SSM, and ESO propagates.
spec:
  # ESO re-fetches from SSM on this interval. 1h balances SSM API cost vs.
  # rotation propagation time. The ops rotation runbook accounts for this window.
  refreshInterval: 1h

  secretStoreRef:
    name: harbor-ssm
    kind: ClusterSecretStore

  target:
    name: harbor-kms-credentials
    # ESO owns the Secret lifecycle. Do not create this Secret manually.
    creationPolicy: Owner
    # Retain the last-synced Secret if the ExternalSecret is deleted or ESO
    # is unavailable — keeps harbor-hot running (break-glass documented in README.md).
    deletionPolicy: Retain

  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /harbor/kms/aws-access-key-id

    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /harbor/kms/aws-secret-access-key
