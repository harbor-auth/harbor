{{- if not .Values.hot.secrets.existingSecret }}
# Secret for harbor-hot (the internet-facing OIDC hot path).
#
# SCAFFOLD: prefer hot.secrets.existingSecret pointing at a
# secrets-manager-provisioned Secret (Vault / External Secrets Operator) over
# committing values through Helm.
#
#   DATABASE_URL      — regional Postgres DSN.
#   REDIS_URL         — distributed auth-code, BFF, and abuse-control state.
#   HARBOR_KMS_SECRET — shared user-DEK KEK. This is deliberately distinct
#                       from signing-key configuration in KMS_KEY_MAP.
#   ADMIN_API_TOKEN   — Bearer token guarding /admin/ endpoints. FATAL if
#                       unset.
#   MGMT_HOT_PROXY_TOKEN — always present but inert until
#                       mgmt.cloudIntegration.enabled; see
#                       mgmt.cloudIntegration.hotProxyToken and
#                       internal/cloudapi's key-rotation proxy handler.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harbor.hot.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor.hot.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.hot.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.hot.secrets.redisUrl | quote }}
  HARBOR_KMS_SECRET: {{ required "global.userDekKekSecret is required by harbor-hot" .Values.global.userDekKekSecret | quote }}
  ADMIN_API_TOKEN: {{ .Values.hot.secrets.adminApiToken | quote }}
  # Always present (mirrors deploy/k8s/secret-hot.yaml's parity contract) —
  # inert empty string while mgmt.cloudIntegration.enabled is false. MUST
  # equal harbor-mgmt's MGMT_HOT_PROXY_TOKEN (same values field).
  {{- if .Values.mgmt.cloudIntegration.enabled }}
  MGMT_HOT_PROXY_TOKEN: {{ required "mgmt.cloudIntegration.hotProxyToken is required when cloudIntegration is enabled" .Values.mgmt.cloudIntegration.hotProxyToken | quote }}
  {{- else }}
  MGMT_HOT_PROXY_TOKEN: {{ .Values.mgmt.cloudIntegration.hotProxyToken | quote }}
  {{- end }}
{{- end }}
