{{- if not .Values.mgmt.secrets.existingSecret }}
# Secret for harbor-mgmt (the cold-path enrollment / passkey / dashboard BFF).
#
# SCAFFOLD: prefer mgmt.secrets.existingSecret in production.
#
#   DATABASE_URL      — regional Postgres DSN. Enrollment writes user DEKs here.
#   REDIS_URL         — distributed BFF/WebAuthn/enrollment/abuse state.
#   HARBOR_KMS_SECRET — shared user-DEK KEK. MUST be identical to harbor-hot's.
#   INITIAL_ACCESS_TOKEN — authorization for dynamic client registration.
#   CLOUD_SERVICE_AUTH_PUBLIC_KEY / CLOUD_SERVICE_AUTH_PUBLIC_KEYS /
#   MGMT_HOT_PROXY_TOKEN / SSO_SUBJECT_HMAC_KEY — always present but inert
#   empty strings unless mgmt.cloudIntegration.enabled; see internal/cloudapi
#   and deploy/README.md's "Harbor Cloud management API" section.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harbor.mgmt.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor.mgmt.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.mgmt.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.mgmt.secrets.redisUrl | quote }}
  HARBOR_KMS_SECRET: {{ required "global.userDekKekSecret is required by harbor-mgmt" .Values.global.userDekKekSecret | quote }}
  INITIAL_ACCESS_TOKEN: {{ .Values.mgmt.secrets.initialAccessToken | quote }}
  # Always present (mirrors deploy/k8s/secret-mgmt.yaml's parity contract) —
  # inert empty strings while mgmt.cloudIntegration.enabled is false. Only
  # required (fails the render otherwise) once cloud integration is enabled.
  {{- if .Values.mgmt.cloudIntegration.enabled }}
  CLOUD_SERVICE_AUTH_PUBLIC_KEY: {{ .Values.mgmt.cloudIntegration.cloudServiceAuthPublicKey | quote }}
  CLOUD_SERVICE_AUTH_PUBLIC_KEYS: {{ .Values.mgmt.cloudIntegration.additionalServiceAuthPublicKeys | quote }}
  MGMT_HOT_PROXY_TOKEN: {{ required "mgmt.cloudIntegration.hotProxyToken is required when cloudIntegration is enabled" .Values.mgmt.cloudIntegration.hotProxyToken | quote }}
  SSO_SUBJECT_HMAC_KEY: {{ required "mgmt.cloudIntegration.ssoSubjectHmacKey is required when cloudIntegration is enabled" .Values.mgmt.cloudIntegration.ssoSubjectHmacKey | quote }}
  {{- else }}
  CLOUD_SERVICE_AUTH_PUBLIC_KEY: {{ .Values.mgmt.cloudIntegration.cloudServiceAuthPublicKey | quote }}
  CLOUD_SERVICE_AUTH_PUBLIC_KEYS: {{ .Values.mgmt.cloudIntegration.additionalServiceAuthPublicKeys | quote }}
  MGMT_HOT_PROXY_TOKEN: {{ .Values.mgmt.cloudIntegration.hotProxyToken | quote }}
  SSO_SUBJECT_HMAC_KEY: {{ .Values.mgmt.cloudIntegration.ssoSubjectHmacKey | quote }}
  {{- end }}
{{- end }}
