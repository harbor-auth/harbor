# Non-sensitive config for harbor-hot. Kept out of the Secret so it can be
# reviewed/diffed in plaintext and edited without touching credentials.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "harbor.fullname" . }}-hot-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor.hot.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.hot.port | quote }}
  # ISSUER anchors the OIDC discovery document. MUST be the public HTTPS URL
  # clients reach (matches the Ingress host).
  ISSUER: {{ .Values.hot.issuer | quote }}
  # Browser entry point served by harbor-mgmt on the same public origin.
  LOGIN_URL: {{ required "hot.loginURL is required in production" .Values.hot.loginURL | quote }}
  # REGION binds the issuer host to a region so the fail-closed region
  # middleware resolves /authorize and /token (docs/DESIGN.md §5).
  REGION: {{ .Values.region | default "EU" | quote }}
  KMS_KEY_MAP: {{ required "kmsKeyMap is required in production" .Values.kmsKeyMap | quote }}
