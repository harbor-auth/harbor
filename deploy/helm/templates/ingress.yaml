{{- if .Values.ingress.enabled }}
# Ingress: the shared public origin routes the BFF login paths and the
# public signup/sign-in surface (/signup*, /signin, /enroll, /webauthn/*,
# /recovery/*, /dashboard*) to harbor-mgmt; every other path goes to
# harbor-hot. Other management APIs stay unreachable because no public path
# selects them.
#
# The host here MUST match hot.issuer, or the OIDC discovery document will
# advertise endpoints under a different origin than clients reach.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "harbor.fullname" . }}-hot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor.hot.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # Block privileged admin endpoints at the ingress layer — defence-in-depth
    # on top of application-level auth. The /admin/* paths must never be
    # reachable from the internet regardless of auth state.
    nginx.ingress.kubernetes.io/server-snippet: |
      location ~* ^/admin {
        deny all;
        return 403;
      }
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      # SCAFFOLD: provision this cert (e.g. via cert-manager) — the Secret must
      # exist before the Ingress can terminate TLS.
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: {{ include "harbor.fullname" . }}-mgmt
                port:
                  number: 80
          - path: /signup
            pathType: Prefix
            backend:
              service:
                name: {{ include "harbor.fullname" . }}-mgmt
                port:
                  number: 80
          - path: /signin
            pathType: Prefix
            backend:
              service:
                name: {{ include "harbor.fullname" . }}-mgmt
                port:
                  number: 80
          - path: /enroll
            pathType: Prefix
            backend:
              service:
                name: {{ include "harbor.fullname" . }}-mgmt
                port:
                  number: 80
          - path: /webauthn
            pathType: Prefix
            backend:
              service:
                name: {{ include "harbor.fullname" . }}-mgmt
                port:
                  number: 80
          - path: /recovery
            pathType: Prefix
            backend:
              service:
                name: {{ include "harbor.fullname" . }}-mgmt
                port:
                  number: 80
          # /dashboard: the BFF dashboard (internal/bff/dashboard.go) — where
          # BOTH the post-registration handoff and GET /login/sso's 303 land
          # (SSO_DASHBOARD_PATH defaults to "/dashboard"; M2). Without this
          # entry the request falls through to the "/" catch-all below and
          # harbor-hot 404s it — the caller reaches this handoff having
          # already authenticated, then gets a bare 404 instead of their
          # dashboard.
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: {{ include "harbor.fullname" . }}-mgmt
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "harbor.fullname" . }}-hot
                port:
                  number: 80
{{- end }}
