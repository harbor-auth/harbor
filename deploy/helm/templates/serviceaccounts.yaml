{{- if .Values.serviceAccount.create }}
# Dedicated ServiceAccounts, one per binary. Neither harbor-hot nor harbor-mgmt
# calls the Kubernetes API, so both disable token automounting: a compromised
# pod then holds NO usable K8s API token, shrinking lateral-movement blast
# radius.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "harbor.hot.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor.hot.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "harbor.mgmt.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor.mgmt.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- if .Values.relay.enabled }}
---
# Only when the relay is enabled — deployment-relay.yaml names this SA, and a
# pod referencing a ServiceAccount that does not exist is never admitted, so
# omitting it does not degrade the relay, it prevents it from starting at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "harbor.relay.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor.relay.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
