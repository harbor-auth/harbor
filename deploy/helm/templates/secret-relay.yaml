{{- if and .Values.relay.enabled (not .Values.relay.secrets.existingSecret) }}
# SCAFFOLD: prefer relay.secrets.existingSecret in production (wire to a secrets
# manager). Keys consumed by harbor-relay (cmd/harbor-relay/main.go):
#   DATABASE_URL           — regional Postgres DSN (encrypted mapping store).
#   HARBOR_KMS_SECRET      — regional KEK sealing per-user DEKs.
#   RELAY_DKIM_PRIVATE_KEY — PEM RSA private key for ARC sealing (optional).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harbor.fullname" . }}-relay-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor.relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.relay.secrets.databaseUrl | quote }}
  HARBOR_KMS_SECRET: {{ .Values.relay.secrets.kekSecret | quote }}
  RELAY_DKIM_PRIVATE_KEY: {{ .Values.relay.secrets.dkimPrivateKey | quote }}
{{- end }}
