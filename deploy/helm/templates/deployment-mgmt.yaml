{{- $digest := required "mgmt.image.digest must pin a signed sha256 image" .Values.mgmt.image.digest -}}
# Deployment: harbor-mgmt — the cold-path management binary (passkey ceremonies,
# user enrollment, dashboard/BFF, consent/audit). NOT internet-facing: reached
# only via the cluster-internal Service and locked down by NetworkPolicy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harbor.fullname" . }}-mgmt
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor.mgmt.labels" . | nindent 4 }}
spec:
  # Enrollment, BFF, and WebAuthn ceremony state is shared through Redis, so
  # replicas can be rolled and scaled without losing in-flight ceremonies.
  replicas: {{ .Values.mgmt.replicaCount }}
  selector:
    matchLabels:
      {{- include "harbor.mgmt.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "harbor.mgmt.labels" . | nindent 8 }}
      annotations:
        # Hold the app container until the Linkerd proxy sidecar is ready, so
        # early outbound connections (PostgreSQL/Redis) aren't dropped on
        # startup while the mesh warms up.
        config.linkerd.io/proxy-await: enabled
        # PostgreSQL (5432) and Redis (6379) are server-speaks-first protocols
        # that Linkerd cannot proxy cleanly here; connect to them directly.
        # mTLS still covers hot↔mgmt and ingress↔mgmt edges.
        config.linkerd.io/skip-outbound-ports: "5432,6379"
    spec:
      # Dedicated SA with no auto-mounted API token (harbor-mgmt never calls the
      # K8s API).
      serviceAccountName: {{ include "harbor.mgmt.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "harbor.mgmt.selectorLabels" . | nindent 14 }}
      containers:
        - name: harbor-mgmt
          image: {{ include "harbor.mgmt.image" . }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mgmt.port }}
          # Config (including regional KMS/WebAuthn settings), then secrets
          # (DATABASE_URL/REDIS_URL).
          envFrom:
            - configMapRef:
                name: {{ include "harbor.fullname" . }}-mgmt-config
            - secretRef:
                name: {{ include "harbor.mgmt.secretName" . }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          resources:
            {{- toYaml .Values.mgmt.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.global.postgresTLS.enabled }}
            - name: postgresql-ca
              mountPath: {{ .Values.global.postgresTLS.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.global.postgresTLS.enabled }}
        - name: postgresql-ca
          secret:
            secretName: {{ required "global.postgresTLS.secretName is required when PostgreSQL TLS is enabled" .Values.global.postgresTLS.secretName }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
