# oapi-codegen config — generates Go types + std-http server from
# harbor-cloud.yaml.
#
# Invoked by `@codegen`:
#   oapi-codegen -config api/openapi/oapi-codegen-cloud.yaml api/openapi/harbor-cloud.yaml
#
# Separate package from harbor.gen.go (distinct schemas, e.g. both specs
# define an `Error` type) so the two generated Go packages never collide.
# Output lands under internal/gen/openapi/cloud/** and is NEVER hand-edited
# (DESIGN §1.3).
package: cloudopenapi
output: internal/gen/openapi/cloud/harbor_cloud.gen.go
generate:
  models: true
  std-http-server: true
  embedded-spec: true
output-options:
  skip-fmt: false
  skip-prune: false
