<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your passkey — Harbor</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;color:#111;min-height:100vh}
.nav{background:#1a1a2e;color:#fff;padding:1rem 2rem;display:flex;align-items:center;gap:1rem}
.nav h1{font-size:1.1rem;font-weight:600;letter-spacing:.02em}
.container{max-width:640px;margin:2rem auto;padding:0 1.5rem}
.card{background:#fff;border-radius:8px;padding:2rem;margin-bottom:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{font-size:1.4rem;font-weight:700;margin-bottom:.75rem}
.card p{color:#444;line-height:1.6;margin-bottom:.75rem}
button#create-passkey{background:#1a1a2e;color:#fff;border:none;border-radius:6px;padding:.85rem 1.5rem;font-size:1rem;font-weight:600;cursor:pointer;width:100%}
button#create-passkey:disabled{opacity:.6;cursor:not-allowed}
button#create-passkey:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
.status{border-radius:6px;padding:.75rem 1rem;margin-bottom:1rem}
.status.error{background:#fdecea;color:#7a1f16;border:1px solid #f3b7ae}
.status.info{background:#eef4ff;color:#173a70;border:1px solid #bcd4ff}
noscript p{background:#fff3cd;color:#664d03;border:1px solid #ffe69c;border-radius:6px;padding:.75rem 1rem}
</style>
</head>
<body>
<nav class="nav"><h1>⚓ Harbor</h1></nav>
<main class="container">
  <noscript><p>Creating a passkey requires JavaScript, so your browser can talk directly to your device's authenticator.</p></noscript>
  <section class="card">
    <h2>Create your passkey</h2>
    <p>A passkey lets you sign in with your device's fingerprint, face, or PIN — no password to remember, type, or leak. Your device creates and stores it; Harbor only ever sees the public key.</p>
    <p id="passkey-status" class="status info" role="status" aria-live="polite" hidden></p>
    <button type="button" id="create-passkey">Create passkey</button>
  </section>
</main>
<script>
(function () {
  "use strict";

  var statusBox = document.getElementById("passkey-status");
  var createButton = document.getElementById("create-passkey");

  function showStatus(message, isError) {
    statusBox.textContent = message;
    statusBox.className = "status " + (isError ? "error" : "info");
    statusBox.hidden = false;
  }

  function base64urlToBuffer(base64url) {
    var padded = base64url + "===".slice((base64url.length + 3) % 4);
    var base64 = padded.replace(/-/g, "+").replace(/_/g, "/");
    var raw = window.atob(base64);
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) {
      bytes[i] = raw.charCodeAt(i);
    }
    return bytes.buffer;
  }

  function bufferToBase64url(buffer) {
    var bytes = new Uint8Array(buffer);
    var binary = "";
    for (var i = 0; i < bytes.byteLength; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    return window.btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function decodeCreationOptions(publicKey) {
    publicKey.challenge = base64urlToBuffer(publicKey.challenge);
    publicKey.user.id = base64urlToBuffer(publicKey.user.id);
    if (Array.isArray(publicKey.excludeCredentials)) {
      publicKey.excludeCredentials = publicKey.excludeCredentials.map(function (cred) {
        return {
          type: cred.type,
          id: base64urlToBuffer(cred.id),
          transports: cred.transports
        };
      });
    }
    return publicKey;
  }

  function encodeCreationResponse(credential) {
    var response = {
      id: credential.id,
      rawId: bufferToBase64url(credential.rawId),
      type: credential.type,
      response: {
        attestationObject: bufferToBase64url(credential.response.attestationObject),
        clientDataJSON: bufferToBase64url(credential.response.clientDataJSON)
      }
    };
    if (credential.authenticatorAttachment) {
      response.authenticatorAttachment = credential.authenticatorAttachment;
    }
    if (typeof credential.getClientExtensionResults === "function") {
      response.clientExtensionResults = credential.getClientExtensionResults();
    }
    return response;
  }

  async function createPasskey() {
    createButton.disabled = true;
    showStatus("Talk to your device to create a passkey…", false);
    try {
      var beginResponse = await fetch("/webauthn/register/begin", {
        method: "POST",
        credentials: "same-origin"
      });
      if (!beginResponse.ok) {
        throw new Error("begin failed");
      }
      var beginData = await beginResponse.json();
      var options = decodeCreationOptions(beginData.publicKey);

      var credential = await navigator.credentials.create({ publicKey: options });
      if (!credential) {
        throw new Error("no credential returned");
      }

      var finishResponse = await fetch("/webauthn/register/finish", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(encodeCreationResponse(credential))
      });
      if (!finishResponse.ok) {
        throw new Error("finish failed");
      }

      showStatus("Passkey created. Continuing…", false);
      window.location.assign("/signup/recovery");
    } catch (err) {
      if (err && err.name === "NotAllowedError") {
        showStatus("Passkey creation was cancelled. You can try again when you're ready.", true);
      } else {
        showStatus("We couldn't create your passkey. Please try again.", true);
      }
      createButton.disabled = false;
    }
  }

  if (!window.PublicKeyCredential) {
    createButton.disabled = true;
    showStatus("This browser doesn't support passkeys. Please try a recent version of Chrome, Safari, Edge, or Firefox.", true);
  } else {
    createButton.addEventListener("click", createPasskey);
  }
})();
</script>
</body>
</html>
