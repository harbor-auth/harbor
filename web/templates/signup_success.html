<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're all set — Harbor</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;color:#111;min-height:100vh}
.nav{background:#1a1a2e;color:#fff;padding:1rem 2rem;display:flex;align-items:center;gap:1rem}
.nav h1{font-size:1.1rem;font-weight:600;letter-spacing:.02em}
.container{max-width:480px;margin:3rem auto;padding:0 1.5rem}
.card{background:#fff;border-radius:8px;padding:2rem;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.check{font-size:2.5rem;color:#2a7a4f;margin-bottom:.5rem}
.card h2{font-size:1.4rem;font-weight:700;margin-bottom:.5rem}
.card p{color:#555;line-height:1.6;margin-bottom:1.5rem}
.button{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.75rem 1rem;border-radius:6px;border:2px solid transparent;background:#1a1a2e;color:#fff;font-size:1rem;font-weight:600;text-decoration:none}
.button:focus-visible{outline:3px solid #4d7cff;outline-offset:2px}
</style>
</head>
<body>
<nav class="nav">
  <h1>⚓ Harbor</h1>
</nav>
<main class="container">
  <div class="card">
    <p class="check" aria-hidden="true">✓</p>
    <h2>You're all set</h2>
    <p>Your Harbor account is ready, your passkey is registered, and your recovery codes are saved. You can review or revoke any app's access at any time from your dashboard.</p>
    <a class="button" href="{{.ReturnTo}}">Continue</a>
  </div>
</main>
</body>
</html>
