# Harbor — CD: build & publish the runtime images, then pin them for GitOps.
#
# On every push to main that touches Go/Docker sources, this builds the two
# runtime binaries into images and pushes them to GHCR under
# ghcr.io/harbor-auth/harbor/{harbor-hot,harbor-mgmt}, tagged with both the
# immutable 12-char commit SHA and the moving `latest` tag. Each pushed image
# is keyless-signed at its canonical digest with GitHub's OIDC identity.
#
# Signed digests are proposed in a pull request. Main stays protected, including
# against the publishing bot; CI and an operator review precede deployment.
name: publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'deploy/Dockerfile.hot'
      - 'deploy/Dockerfile.mgmt'
      - 'deploy/Dockerfile.migrate'
      - 'db/migrations/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io/harbor-auth/harbor

concurrency:
  group: production-image-publish
  cancel-in-progress: false

jobs:
  build-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Build & push harbor-hot
        id: build-hot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.hot
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/harbor-hot:${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/harbor-hot:latest
          cache-from: type=gha,scope=harbor-hot
          cache-to: type=gha,scope=harbor-hot,mode=max

      - name: Build & push harbor-mgmt
        id: build-mgmt
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.mgmt
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/harbor-mgmt:${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/harbor-mgmt:latest
          cache-from: type=gha,scope=harbor-mgmt
          cache-to: type=gha,scope=harbor-mgmt,mode=max

      # DB-migration runner image: golang-migrate + the embedded db/migrations
      # SQL. Consumed by the pre-install/pre-upgrade hook Job in the Helm chart,
      # tagged with the same immutable SHA so schema and binaries deploy in
      # lockstep.
      - name: Build & push harbor-migrate
        id: build-migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.migrate
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/harbor-migrate:${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/harbor-migrate:latest
          cache-from: type=gha,scope=harbor-migrate
          cache-to: type=gha,scope=harbor-migrate,mode=max

      # Sign immutable references, never tags. With no key configured Cosign
      # exchanges GitHub's OIDC token for a short-lived Fulcio certificate and
      # records each signature in Rekor's transparency log.
      - name: Keyless-sign published images
        env:
          HOT_DIGEST: ${{ steps.build-hot.outputs.digest }}
          MGMT_DIGEST: ${{ steps.build-mgmt.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.build-migrate.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/harbor-hot@${HOT_DIGEST}"
          cosign sign --yes "${REGISTRY}/harbor-mgmt@${MGMT_DIGEST}"
          cosign sign --yes "${REGISTRY}/harbor-migrate@${MIGRATE_DIGEST}"

      # Pin the exact signed manifests into the ArgoCD prod values file. yq
      # (mikefarah) is preinstalled on ubuntu-latest; env() keeps values out of
      # the expression and updates all components in one operation.
      - name: Pin signed image digests in values-prod.yaml
        env:
          HOT_DIGEST: ${{ steps.build-hot.outputs.digest }}
          MGMT_DIGEST: ${{ steps.build-mgmt.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.build-migrate.outputs.digest }}
        run: |
          yq -i '
            .global.image.sourceRevision = strenv(GITHUB_SHA) |
            .hot.image.digest = env(HOT_DIGEST) |
            .mgmt.image.digest = env(MGMT_DIGEST) |
            .migrate.image.digest = env(MIGRATE_DIGEST) |
            del(.global.image.tag)
          ' deploy/argocd/values-prod.yaml

      # Do not grant this bot a main-branch bypass. The explicit dispatch
      # supplies CI even when token-created PR events need GitHub approval.
      - name: Propose signed digests for production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git diff --quiet "$GITHUB_SHA" origin/main -- cmd internal web db/migrations go.mod go.sum deploy/Dockerfile.hot deploy/Dockerfile.mgmt deploy/Dockerfile.migrate; then
            echo "A newer source revision exists; refusing to propose stale images."
            exit 1
          fi
          pin_branch="deploy/images-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          git switch -c "$pin_branch"
          git add deploy/argocd/values-prod.yaml
          if git diff --staged --quiet; then
            echo "Image digests already pinned."
            exit 0
          fi
          git commit -m "chore(deploy): propose signed image digests"
          git push origin "$pin_branch"
          cat > "$RUNNER_TEMP/deploy-pr.md" <<EOF
          Deploy signed runtime images built from main revision $GITHUB_SHA.

          Review the pinned digests and successful CI before merging. ArgoCD deploys the merged values; publishing alone does not change production.
          EOF
          gh pr create --base main --head "$pin_branch" --title "chore(deploy): signed images for ${GITHUB_SHA::12}" --body-file "$RUNNER_TEMP/deploy-pr.md"
          gh workflow run ci.yml --ref "$pin_branch"

      # Package visibility is an explicit owner decision. Publishing a release
      # must not turn private runtime images into publicly downloadable packages.
